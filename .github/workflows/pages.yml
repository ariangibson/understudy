name: Pages

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - site/**
      - docs/banner.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp docs/banner.jpg _site/
          cp install.sh _site/install.sh
          cp install.sh _site/install
          echo understudy.cc > _site/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
